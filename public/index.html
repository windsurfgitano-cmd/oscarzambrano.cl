  <link rel="canonical" href="https://oscarzambrano.cl/">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="preload" href="/assets/Anton.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="/assets/Inter.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="/styles.css">
  <meta property="og:type" content="website">
  <meta property="og:locale" content="es_CL">
  <meta property="og:site_name" content="Oscar Zambrano">
  <meta property="og:title" content="Oscar Zambrano — En construcción">

  <meta property="og:url" content="https://oscarzambrano.cl/">
  <meta property="og:image" content="https://oscarzambrano.cl/assets/compartir.png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">

<body>
  <a class="skip-link" href="#contenido">Ir al contenido</a>
  <div class="site-shell">
    <header class="site-header">
      <a class="brand" href="/" aria-label="Oscar Zambrano inicio">
        <svg class="signature" viewBox="230 1150 272 60" role="img" aria-label="Oscar Zambrano">
          <image href="/assets/firma-referencia.png" width="752" height="1344"/>
        </svg>
      </a>
      <span class="build-status"><span aria-hidden="true"></span>Construyendo lo que viene</span>
    </header>

    <main id="contenido" class="hero">
      <div class="hero-copy">
        <h1>En<br>construcción<span class="title-dot">.</span></h1>
        <p class="intro">Estoy preparando herramientas, guías y demostraciones para aplicar IA a tu trabajo.</p>
        <p class="audience">Para emprendedores y profesionales de Chile.</p>
        <a class="instagram-link" href="https://www.instagram.com/oscarzambrano.cl/" target="_blank" rel="noopener noreferrer">
          <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4"/><circle class="ig-dot" cx="17.5" cy="6.5" r="1"/></svg>
          <span>Ver @oscarzambrano.cl</span>
          <svg class="external-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 18 18 6M6 6h12v12"/></svg>
        </a>
        <p class="follow-note">Sigue el proceso en Instagram.</p>
      </div>

      <figure class="hero-art">
        <svg class="character-scene" viewBox="0 0 752 1100" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="personaje-titulo">
          <title id="personaje-titulo">Oscar Zambrano en versión chibi, con sobrecamisa violeta, convirtiendo notas en tareas</title>
          <defs><clipPath id="escena-personaje"><rect width="752" height="1100"/></clipPath></defs>
          <image href="/assets/oscar-chibi.png" width="752" height="1344" clip-path="url(#escena-personaje)"/>
        </svg>
      </figure>
    </main>

    <footer class="site-footer">
      <span>Oscar Zambrano</span>
      <span>oscarzambrano.cl</span>
    </footer>
  </div>
